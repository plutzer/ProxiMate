# Runs the pytest suite on every pull request and on pushes to the two long-lived
# branches.  The suite needs only requirements.txt: no SAINTexpress binary and no
# annotation databases, so a plain Python runner is enough and no image is built.
name: Tests

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q
