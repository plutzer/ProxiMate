# Categories for the "Generate release notes" button on the Releases page.
# Pull requests are grouped by label; unlabeled ones land under "Other changes".
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
